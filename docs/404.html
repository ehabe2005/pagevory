<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found — Pagevory</title><meta name="robots" content="noindex"><link rel="icon" href="/assets/favicon.png"><style>:root{--ink:#0b1a2c;--ink2:#12243a;--paper:#f5efe4;--paper2:#ebe2d1;--gold:#c2a46a;--gold2:#e2cb98;--muted:#aab4c0;--line:#ffffff22;--serif:'Instrument Serif',Georgia,serif;--sans:'Instrument Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
em{font-style:italic;color:var(--gold2)}
p{margin:0 0 1em;text-wrap:pretty}
.wrap{max-width:1240px;margin:0 auto;padding:0 6%}
.skip{position:absolute;left:-999px;top:8px;background:var(--paper);color:var(--ink);padding:8px 14px;z-index:99}.skip:focus{left:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

/* nav */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:#0b1a2cee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font:600 15px var(--sans);letter-spacing:.32em}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.links{display:flex;align-items:center;gap:28px;font-size:14px;color:#d8d2c6}
.links a:not(.btn):hover{color:var(--paper)}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);padding:16px 26px;border-radius:999px;font:600 14px var(--sans);letter-spacing:.01em;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:#fff}
.btn.sm{padding:11px 18px;font-size:13px}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px #ffffff55}.btn.ghost:hover{background:#ffffff12}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:6%;align-items:center;min-height:calc(100vh - 70px);padding-top:60px;padding-bottom:70px}
.eyebrow{font:600 11.5px/1.6 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0 0 22px}
.eyebrow.center,.center{text-align:center}
h1{font-size:clamp(58px,7.4vw,112px);line-height:.95;letter-spacing:-.025em;margin-bottom:30px}
.lead{font-size:18.5px;line-height:1.65;color:#c9cfd6;max-width:470px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin:34px 0 22px}
.fine{font-size:12.5px;line-height:1.6;color:var(--muted)}
.hero-art{position:relative;height:660px}
.pg{position:absolute;width:66%;border-radius:4px;box-shadow:0 30px 60px #0009,0 6px 14px #0006}
.pg.back{right:-4%;top:0;transform:rotate(6deg);opacity:.92}
.pg.front{left:0;bottom:0;transform:rotate(-5deg);transition:transform .6s}
.hero-art:hover .pg.front{transform:rotate(-2deg) translateY(-8px)}
.badge{position:absolute;left:0;top:30px;background:var(--ink);border:1px solid #ffffff40;color:#d8d2c6;font:600 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:9px 14px;border-radius:999px}

/* strip */
.strip{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:18px 28px;padding:22px 5%;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:600 11.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#d6cfc2}
.strip i{font-style:normal;color:var(--gold);font-size:10px}

/* sections */
.section{padding:120px 0}
h2{font-size:clamp(40px,5vw,70px);line-height:1.02;letter-spacing:-.02em;margin-bottom:30px}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:10%;align-items:end}
.intro p{color:#c4cad2;font-size:17px}
.light{background:var(--paper);color:var(--ink)}
.light em{color:#9c7a3c}
.light .eyebrow{color:#8a6a33}
.steps{list-style:none;padding:0;margin:60px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:44px}
.steps li{border-top:1px solid #0b1a2c33;padding-top:26px}
.num{font:italic 34px var(--serif);color:#9c7a3c}
.steps h3{font-size:30px;margin:10px 0 12px}
.steps p{color:#4d5862;font-size:15px}

/* work */
.work{display:grid;grid-template-columns:1.1fr 1fr;gap:8%;align-items:center}
.gallery{position:relative;height:640px}
.gallery figure{position:absolute;margin:0;width:52%;box-shadow:0 26px 50px #0008;border-radius:3px;overflow:hidden}
.g1{left:0;top:0;transform:rotate(-3deg)}
.g2{left:30%;top:9%;z-index:2}
.g3{right:0;bottom:0;transform:rotate(4deg);width:44%!important}
.work-copy p{color:#c4cad2}
.tag{display:inline-block;border:1px solid #ffffff40;border-radius:999px;padding:7px 13px;font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#d6cfc2;margin-bottom:22px}
.also{display:flex;gap:20px;align-items:center;margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}
.also img{width:96px;height:auto;border-radius:3px;box-shadow:0 10px 24px #0007}
.also h3{font-size:26px;margin-bottom:6px}.also p{font-size:14.5px;margin:0}

/* partnership */
.partnership{display:grid;grid-template-columns:1fr 1fr;gap:10%;align-items:center}
.partnership p{color:#4d5862;font-size:16.5px}
.split{font:400 clamp(96px,12vw,170px)/.9 var(--serif);letter-spacing:-.04em;white-space:nowrap;color:var(--ink)}
.split span{color:#b08c4c;font-style:italic;padding:0 .04em}
.split-note{font:italic 26px var(--serif);color:var(--ink)!important;margin:12px 0 20px}
.terms{border-top:1px solid #0b1a2c2a;padding-top:20px;font-size:13.5px!important;line-height:1.7}

/* faq */
.faq{max-width:860px}
details{border-bottom:1px solid var(--line);padding:24px 0}
summary{cursor:pointer;list-style:none;font:400 24px/1.3 var(--serif);padding-right:40px;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';position:absolute;right:4px;top:-2px;color:var(--gold);font:300 30px var(--sans)}
details[open] summary::after{content:'−'}
details p{color:#c4cad2;margin:14px 0 0;font-size:15.5px}

/* contact */
.contact{text-align:center;background:var(--ink2);padding:120px 6%}
.contact h2{margin-bottom:24px}
.contact p{color:#c4cad2;max-width:540px;margin:0 auto 34px;font-size:17px}
.contact .mail{margin:22px auto 0;font-size:14px}.contact .mail a{border-bottom:1px solid #ffffff40}

/* footer */
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:34px 6%;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

/* reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}

@media (max-width:880px){
  .links a:not(.btn){display:none}
  .hero,.intro,.work,.partnership{grid-template-columns:1fr}
  .hero{min-height:0;padding-top:40px;gap:30px}
  .hero-art{height:440px}
  .steps{grid-template-columns:1fr;gap:28px}
  .gallery{height:460px}
  .section{padding:80px 0}
  .strip{font-size:10px;gap:10px 16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}.reveal{opacity:1;transform:none}}
</style></head><body><main class="contact" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center"><p class="eyebrow">404</p><h2>This page isn’t written yet.<br><em>Let’s go back to the start.</em></h2><p><a class="btn" href="/">Pagevory ↗</a></p></main></body></html>
